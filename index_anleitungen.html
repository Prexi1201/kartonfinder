<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anleitungen & Wissen – Heimnetz Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500/30 selection:text-cyan-200 min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-4 md:px-8">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <a href="index.html" title="Zurück zur Startseite" class="p-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <div class="p-2.5 bg-cyan-500/10 border border-cyan-500/30 rounded-xl text-cyan-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">Anleitungen & Wissen</h1>
                    <p class="text-xs text-slate-400">Kategorie auswählen</p>
                </div>
            </div>

            <!-- Schnellsuche über Kategorien -->
            <div class="relative w-full sm:w-72">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input 
                    type="text" 
                    id="categorySearch" 
                    placeholder="Bereich filtern..." 
                    class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-colors"
                >
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 md:px-8 py-8">
        <div id="categoryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Wird per JavaScript aus der Liste unten gefüllt -->
        </div>
    </main>

    <script>
        // =========================================================================
        // HIER DEINE KATEGORIEN / UNTERSEITEN EINTRAGEN ODER ANPASSEN!
        // =========================================================================
        const KATEGORIEN = [
            {
                titel: "Rezepte",
                beschreibung: "Koch- und Backrezepte alphabetisch sortiert",
                link: "rezepte.html",
                badge: "Küche",
                farbe: "cyan", // cyan, emerald, amber, violet, rose, blue
                icon: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />`
            },
            {
                titel: "Aufbauanleitungen",
                beschreibung: "Möbel, Regale, Schreibtisch & Technik-Montage",
                link: "aufbauanleitungen.html",
                badge: "PDFs",
                farbe: "amber",
                icon: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z" />`
            },
            {
                titel: "Geräte & Haushalt",
                beschreibung: "Bedienungsanleitungen für Waschmaschine, Spülmaschine & Co.",
                link: "geraete.html",
                badge: "Handbücher",
                farbe: "emerald",
                icon: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />`
            },
            {
                titel: "PC, 3D-Druck & Technik",
                beschreibung: "Anleitungen für Drucker, Router, Server & Elektronik",
                link: "technik-anleitungen.html",
                badge: "IT & DIY",
                farbe: "violet",
                icon: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />`
            },
            {
                titel: "Garten & Pflanzen",
                beschreibung: "Pflegehinweise, Überwintern & Dünger-Tipps",
                link: "pflanzen.html",
                badge: "Balkon",
                farbe: "blue",
                icon: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />`
            }
        ];

        const FARB_STYLES = {
            cyan: "bg-cyan-500/10 border-cyan-500/30 text-cyan-400 group-hover:border-cyan-400/60",
            amber: "bg-amber-500/10 border-amber-500/30 text-amber-400 group-hover:border-amber-400/60",
            emerald: "bg-emerald-500/10 border-emerald-500/30 text-emerald-400 group-hover:border-emerald-400/60",
            violet: "bg-violet-500/10 border-violet-500/30 text-violet-400 group-hover:border-violet-400/60",
            rose: "bg-rose-500/10 border-rose-500/30 text-rose-400 group-hover:border-rose-400/60",
            blue: "bg-blue-500/10 border-blue-500/30 text-blue-400 group-hover:border-blue-400/60"
        };

        const BADGE_STYLES = {
            cyan: "bg-cyan-500/15 text-cyan-300 border-cyan-500/30",
            amber: "bg-amber-500/15 text-amber-300 border-amber-500/30",
            emerald: "bg-emerald-500/15 text-emerald-300 border-emerald-500/30",
            violet: "bg-violet-500/15 text-violet-300 border-violet-500/30",
            rose: "bg-rose-500/15 text-rose-300 border-rose-500/30",
            blue: "bg-blue-500/15 text-blue-300 border-blue-500/30"
        };

        const grid = document.getElementById("categoryGrid");
        const searchInput = document.getElementById("categorySearch");

        function renderCategories(filter = "") {
            const q = filter.toLowerCase().trim();
            const filtered = KATEGORIEN.filter(k => 
                k.titel.toLowerCase().includes(q) || 
                k.beschreibung.toLowerCase().includes(q) ||
                k.badge.toLowerCase().includes(q)
            );

            grid.innerHTML = "";

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-slate-900/50 border border-slate-800 rounded-2xl">
                        <p class="text-slate-400 text-sm">Kein Bereich gefunden für "<span class="text-white font-semibold">${filter}</span>"</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(kat => {
                const iconStyle = FARB_STYLES[kat.farbe] || FARB_STYLES.cyan;
                const badgeStyle = BADGE_STYLES[kat.farbe] || BADGE_STYLES.cyan;

                const card = document.createElement("a");
                card.href = kat.link;
                card.className = "group bg-slate-900/80 hover:bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl p-6 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-black/30 flex flex-col justify-between";

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-4 mb-4">
                            <div class="p-3 rounded-xl border transition-colors ${iconStyle}">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    ${kat.icon}
                                </svg>
                            </div>
                            <span class="px-2.5 py-1 text-[11px] font-semibold rounded-lg border ${badgeStyle}">
                                ${kat.badge}
                            </span>
                        </div>
                        <h2 class="text-lg font-bold text-white group-hover:text-cyan-300 transition-colors mb-1.5">
                            ${kat.titel}
                        </h2>
                        <p class="text-sm text-slate-400 leading-relaxed">
                            ${kat.beschreibung}
                        </p>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs font-medium text-slate-400 group-hover:text-cyan-400 transition-colors">
                        <span>Öffnen</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        searchInput.addEventListener("input", (e) => renderCategories(e.target.value));
        renderCategories();
    </script>
</body>
</html>
"""

with open("anleitungen.html", "w", encoding="utf-8") as f:
    f.write(html_content)

print("anleitungen.html erfolgreich erstellt.")
