<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #181a1b;
            color: #e8e6e3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background-color: #242729;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 360px;
            border: 1px solid #383c3e;
            text-align: center;
        }
        h2 {
            margin-bottom: 1.5rem;
            font-weight: 500;
            font-size: 1.4rem;
            color: #ffffff;
        }
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            border: 1px solid #484d50;
            background-color: #181a1b;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #4caf50;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            background-color: #4caf50;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: #ff5252;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Geschützter Bereich</h2>
        <form id="loginForm">
            <input type="password" id="passwordInput" placeholder="Passwort eingeben" required>
            <button type="submit">Login</button>
        </form>
        <div id="errorMessage" class="error">Falsches Passwort. Bitte versuche es erneut.</div>
    </div>

    <script>
        // HIER DEIN GEWÜNSCHTES PASSWORT EINTRAGEN:
        const RICHTIGES_PASSWORT = "INreoa#wbgz+!";

        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const eingabe = document.getElementById("passwordInput").value;
            const errorMsg = document.getElementById("errorMessage");

            if (eingabe === RICHTIGES_PASSWORT) {
                window.location.href = "home.html";
            } else {
                errorMsg.style.display = "block";
                document.getElementById("passwordInput").value = "";
            }
        });
    </script>
</body>
</html>
